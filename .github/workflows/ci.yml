name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Content safety
        run: pnpm content:lint
        env:
          CONTENT_DENYLIST: ${{ secrets.CONTENT_DENYLIST }}

      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Worker bundle (dry run)
        run: pnpm deploy:dry

  e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Playwright (no-JS plain path, axe)
        run: pnpm test:e2e
      - name: Lighthouse
        run: |
          pnpm exec wrangler dev --port 8787 &
          npx --yes wait-on@8 http://localhost:8787/ --timeout 60000
          pnpm lhci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-reports
          path: |
            playwright-report/
            .lighthouseci/
          retention-days: 7
