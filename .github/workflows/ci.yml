name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Content safety
        run: pnpm content:lint
        env:
          CONTENT_DENYLIST: ${{ secrets.CONTENT_DENYLIST }}

      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Worker bundle (dry run)
        run: pnpm deploy:dry
